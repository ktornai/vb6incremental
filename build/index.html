<!doctype html>
<html lang="en" data-vb-theme="classic"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="generator" content="VB6 Studio Web 0.6.0"><meta name="color-scheme" content="light"><title>Data Processor 2000</title><meta name="description" content="Incremental game about calculating veryyy big data byte by byte"><link rel="stylesheet" href="./app.css"><link rel="manifest" href="./app.webmanifest"><meta name="theme-color" content="#24364b"></head><body><div id="app"></div><p id="vb6-startup" role="status" aria-live="polite">Starting application…</p><noscript>This application requires JavaScript.</noscript><script id="vb6-project" type="application/json">{"schema":1,"id":"id_mvr47wcg_2j","name":"Data Processor 2000","description":"Incremental game about calculating veryyy big data byte by byte","startup":"Form1","modules":[{"id":"id_mvr47wcg_2h","name":"Form1","kind":"form","code":"Option Explicit\n\nDim gScore as CBigNumber\nDim gBPS as CBigNumber\nDim gClickBPS as CBigNumber\nDim gTickBPS as CBigNumber\n\nDim gCurrentChunkSize as CBigNumber\nDim gPrevChunkSize as CBigNumber\nDim gProcessedChunks as CBigNumber\nDim gNextChunkScaleValue as Double\nDim gChunkProgressValue as Integer\n\nDim gCoins as CBigNumber\n\nDim gAbacusCount as CBigNumber\nDim gAbacusPrice as CBigNumber\nDim gAbacusIncrement as CBigNumber\nDim gAbacusPriceScale as Double\n\nDim gCalculatorPrice as CBigNumber\nDim gCalculatorPriceScale as Double\n\nPrivate Sub UpdateScoreAndBPSLabel()\n    lblScore.Caption = gScore.Display()\n    lblBPS.Caption = \"processing rate: \" + gBPS.Display() + \" bps\"\n    lblCoins.Caption = gCoins.Display()\n    \n    chunkProgress.Value = gChunkProgressValue\n    \n    dbgCurrentChunkSize.Caption = gCurrentChunkSize.Display()\nEnd Sub\n\nPrivate Sub UpdateUpgradeButtons()\n    Dim canBuyAbacus as Boolean\n    canBuyAbacus = gCoins.CanSubtract(gAbacusPrice)\n    buyAbacus.Enabled = canBuyAbacus\n    \n    Dim canBuyCalculator as Boolean\n    canBuyCalculator = gCoins.CanSubtract(gCalculatorPrice)\n    buyCalculator.Enabled = canBuyCalculator\nEnd Sub\n\nPrivate Function CalculateAbacusIncrement() as CBigNumber\n    Dim v as CBigNumber \n    Set v = new CBigNumber\n    \n    v.Value = gAbacusCount.Value\n    v.Multiply(gAbacusIncrement)\n    \n    CalculateAbacusIncrement = v\nEnd Function\n\nPrivate Sub UpdateAbacusButtonText()\n    buyAbacus.Caption = \"Buy Abacus (next: \" + gAbacusPrice.Display + \" coins), have: \" + gAbacusCount.Display\nEnd Sub\n\nPrivate Sub InitUpgrades()\n    Set gAbacusCount = new CBigNumber\n    gAbacusCount.Value = \"0\"\n    Set gAbacusPrice = new CBigNumber\n    gAbacusPrice.Value = \"2\"\n    Set gAbacusIncrement = new CBigNumber\n    gAbacusIncrement.Value = \"1\"\n    gAbacusPriceScale = 0.5\n    buyAbacus.Enabled = False \n    UpdateAbacusButtonText()\n    \n    Set gCalculatorPrice = new CBigNumber\n    gCalculatorPrice.Value = \"10\"\n    gCalculatorPriceScale = 0.2\n    buyCalculator.Enabled = False \nEnd Sub\n\nPrivate Sub Form_Load()\n    Set gScore = new CBigNumber\n    gScore.Value = \"0\"\n    \n    Set gBPS = new CBigNumber\n    gBPS.Value = \"0\"\n    \n    Set gClickBPS = new CBigNumber\n    gClickBPS.Value = \"1\"\n      \n    Set gTickBPS = new CBigNumber\n    gTickBPS.Value = \"0\"\n    \n    Set gCurrentChunkSize = new CBigNumber\n    gCurrentChunkSize.Value = \"10\"\n    \n    Set gPrevChunkSize = new CBigNumber\n    gPrevChunkSize.Value = \"0\"\n    \n    Set gProcessedChunks = new CBigNumber\n    gProcessedChunks.Value = \"0\"\n    \n    gNextChunkScaleValue = 0.3\n    gChunkProgressValue = 0\n\n    Set gCoins = new CBigNumber    \n    gCoins.Value = \"0\"\n    \n    InitUpgrades()\n    UpdateScoreAndBPSLabel()\nEnd Sub\n\nPrivate Sub crunchButton_Click()\n    gTickBPS.Add(gClickBPS)\nEnd Sub\n\nPrivate Sub gameTimer_Timer()\n    gBPS.Value = \"0\" ' or some kind BaseBPS value\n    gBPS.Add(CalculateAbacusIncrement())\n    \n    If Not gBPS.IsZero Then\n        gTickBPS.AddPercent(gBPS, 0.25)\n    End If\n    \n    gScore.Add(gTickBPS)\n    gTickBPS.Value = \"0\"\n    \n    gChunkProgressValue = CInt(gScore.PercentOf(gCurrentChunkSize))\n    \n    If gChunkProgressValue \u003e= 100 Then\n        gProcessedChunks.Increment()\n \n        gPrevChunkSize = gCurrentChunkSize\n        gCurrentChunkSize.AddPercent(gCurrentChunkSize, gNextChunkScaleValue)\n        \n        gCoins.Increment()\n        gChunkProgressValue = 100     \n    End If\n    \n    UpdateUpgradeButtons()\n    UpdateScoreAndBPSLabel()\nEnd Sub\n\nPrivate Sub buyAbacus_Click()\n    gCoins.Subtract(gAbacusPrice)\n    \n    'gAbacusPricesScale = gAbacusPriceScale + 0.1\n    gAbacusPrice.AddPercent(gAbacusPrice, gAbacusPriceScale)\n    gAbacusCount.Increment()\n     \n    UpdateAbacusButtonText()\nEnd Sub\n\nPrivate Sub buyCalculator_Click()\n    gCoins.Subtract(gAbacusPrice)\n    gBPS.AddString(\"19\")\nEnd Sub\n","form":{"id":"id_mvr47wcg_2i","name":"Form1","type":"Form","properties":{"Name":"Form1","Caption":"Data Processor 2000","ClientWidth":11280,"ClientHeight":5760,"Width":9120,"Height":6450,"Left":2293,"Top":3102,"StartUpPosition":2,"BorderStyle":1,"BackColor":-2147483633,"ForeColor":-2147483640,"FontName":"MS Sans Serif","FontSize":8.25,"FontBold":0,"FontItalic":0,"ScaleMode":3,"KeyPreview":0,"Visible":-1,"Enabled":-1},"controls":[{"id":"id_mvr49jrv_2n","name":"crunchButton","type":"CommandButton","parent":null,"properties":{"Name":"crunchButton","Left":1440,"Top":1920,"Width":3120,"Height":2400,"Visible":-1,"Enabled":-1,"TabIndex":0,"TabStop":-1,"FontName":"MS Sans Serif","FontSize":8.25,"FontBold":0,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483633,"ToolTipText":"","Tag":"","Caption":"Process data","Default":0,"Cancel":0}},{"id":"id_mvr4atxn_2o","name":"Label1","type":"Label","parent":null,"properties":{"Name":"Label1","Left":2400,"Top":360,"Width":1320,"Height":240,"Visible":-1,"Enabled":-1,"TabIndex":1,"TabStop":0,"FontName":"MS Sans Serif","FontSize":8.25,"FontBold":0,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483633,"ToolTipText":"","Tag":"","Caption":"Data processed:","BackStyle":0,"Alignment":2}},{"id":"id_mvr4bj41_2p","name":"lblScore","type":"Label","parent":null,"properties":{"Name":"lblScore","Left":0,"Top":720,"Width":6120,"Height":720,"Visible":-1,"Enabled":-1,"TabIndex":2,"TabStop":0,"FontName":"MS Sans Serif","FontSize":20,"FontBold":-1,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483633,"ToolTipText":"","Tag":"","Caption":"0","BackStyle":0,"Alignment":2,"FontUnderline":0,"FontStrikethru":0}},{"id":"id_mvr4mhys_2u","name":"lblBPS","type":"Label","parent":null,"properties":{"Name":"lblBPS","Left":0,"Top":1440,"Width":6120,"Height":480,"Visible":-1,"Enabled":-1,"TabIndex":3,"TabStop":0,"FontName":"MS Sans Serif","FontSize":10,"FontBold":-1,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483633,"ToolTipText":"","Tag":"","Caption":"processing rate: 0","BackStyle":0,"Alignment":2,"FontUnderline":0,"FontStrikethru":0}},{"id":"id_mvtzju7f_2b","name":"chunkProgress","type":"ProgressBar","parent":null,"properties":{"Name":"chunkProgress","Left":1440,"Top":4920,"Width":3120,"Height":360,"Visible":-1,"Enabled":-1,"TabIndex":4,"TabStop":0,"FontName":"MS Sans Serif","FontSize":8.25,"FontBold":0,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483633,"ToolTipText":"","Tag":"","Min":0,"Max":100,"Value":0}},{"id":"id_mvtzkkmm_2c","name":"Label2","type":"Label","parent":null,"properties":{"Name":"Label2","Left":1440,"Top":4680,"Width":3240,"Height":240,"Visible":-1,"Enabled":-1,"TabIndex":5,"TabStop":0,"FontName":"MS Sans Serif","FontSize":8.25,"FontBold":0,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483633,"ToolTipText":"","Tag":"","Caption":"Current data chunk:","BackStyle":0,"Alignment":0}},{"id":"id_mvu0sn7n_2g","name":"gameTimer","type":"Timer","parent":null,"properties":{"Name":"gameTimer","Left":4800,"Top":2880,"Width":420,"Height":420,"Visible":-1,"Enabled":-1,"TabIndex":0,"TabStop":0,"FontName":"MS Sans Serif","FontSize":8.25,"FontBold":0,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483633,"ToolTipText":"","Tag":"","Interval":250}},{"id":"id_mvu3ph9w_2k","name":"buyAbacus","type":"CommandButton","parent":null,"properties":{"Name":"buyAbacus","Left":6960,"Top":1440,"Width":3840,"Height":600,"Visible":-1,"Enabled":-1,"TabIndex":6,"TabStop":-1,"FontName":"MS Sans Serif","FontSize":8.25,"FontBold":0,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483633,"ToolTipText":"Simple but not poweful tool to crunch data.","Tag":"","Caption":"Buy Abacus","Default":0,"Cancel":0}},{"id":"id_mvu3t515_2n","name":"PictureBox1","type":"PictureBox","parent":null,"properties":{"Name":"PictureBox1","Left":6240,"Top":1440,"Width":600,"Height":600,"Visible":-1,"Enabled":-1,"TabIndex":7,"TabStop":-1,"FontName":"MS Sans Serif","FontSize":8.25,"FontBold":0,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483647,"ToolTipText":"","Tag":"","ScaleMode":3,"AutoRedraw":-1,"BorderStyle":0}},{"id":"id_mvu4cfhe_2y","name":"buyCalculator","type":"CommandButton","parent":null,"properties":{"Name":"buyCalculator","Left":6960,"Top":2280,"Width":3840,"Height":600,"Visible":-1,"Enabled":-1,"TabIndex":8,"TabStop":-1,"FontName":"MS Sans Serif","FontSize":8.25,"FontBold":0,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483633,"ToolTipText":"Simple tool do basic arithmetic slowly.","Tag":"","Caption":"Buy Calculator","Default":0,"Cancel":0},"nativeParentId":null},{"id":"id_mvu4ciox_2z","name":"PictureBox2","type":"PictureBox","parent":null,"properties":{"Name":"PictureBox2","Left":6240,"Top":2280,"Width":600,"Height":600,"Visible":-1,"Enabled":-1,"TabIndex":9,"TabStop":-1,"FontName":"MS Sans Serif","FontSize":8.25,"FontBold":0,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483647,"ToolTipText":"","Tag":"","ScaleMode":3,"AutoRedraw":-1,"BorderStyle":0},"nativeParentId":null},{"id":"id_mvu5u9es_3m","name":"dbgCurrentChunkSize","type":"Label","parent":null,"properties":{"Name":"dbgCurrentChunkSize","Left":1440,"Top":5400,"Width":3120,"Height":240,"Visible":-1,"Enabled":-1,"TabIndex":10,"TabStop":0,"FontName":"MS Sans Serif","FontSize":8.25,"FontBold":0,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483633,"ToolTipText":"","Tag":"","Caption":"Label","BackStyle":0,"Alignment":0}},{"id":"id_mvu6gden_43","name":"Label3","type":"Label","parent":null,"properties":{"Name":"Label3","Left":7800,"Top":360,"Width":2160,"Height":240,"Visible":-1,"Enabled":-1,"TabIndex":11,"TabStop":0,"FontName":"MS Sans Serif","FontSize":8.25,"FontBold":0,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483633,"ToolTipText":"","Tag":"","Caption":"Coins:","BackStyle":0,"Alignment":2}},{"id":"id_mvu6gx8h_44","name":"lblCoins","type":"Label","parent":null,"properties":{"Name":"lblCoins","Left":6960,"Top":720,"Width":3840,"Height":720,"Visible":-1,"Enabled":-1,"TabIndex":12,"TabStop":0,"FontName":"MS Sans Serif","FontSize":20,"FontBold":-1,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483633,"ToolTipText":"","Tag":"","Caption":"0","BackStyle":0,"Alignment":2,"FontUnderline":0,"FontStrikethru":0},"nativeParentId":null}],"menus":[]},"bookmarks":[]},{"id":"id_mvtynqyn_1j","name":"CBigNumber","kind":"class","code":"Option Explicit\n\nPrivate mDigits As String\nPrivate mFraction As Double\n\nPrivate Sub Class_Initialize()\n    mDigits = \"0\"\n    mFraction = 0#\nEnd Sub\n\nPublic Property Get Value() As String\n    Value = mDigits\nEnd Property\n\nPublic Property Let Value(ByVal s As String)\n    mDigits = Normalize(s)\nEnd Property\n\nPublic Function IsZero() as Boolean\n    IsZero = mDigits = \"0\" And mFraction = 0#\nEnd Function\n\nPublic Sub Add(ByVal Other As CBigNumber)\n    mDigits = AddAbs(mDigits, Other.Value)\nEnd Sub\n\nPublic Sub AddString(ByVal Other As String)\n    Dim temp As CBigNumber\n\n    Set temp = New CBigNumber\n    temp.Value = Normalize(Other)\n\n    Add(temp)\nEnd Sub\n\nPublic Sub Increment()\n    Dim temp As CBigNumber\n    Set temp = New CBigNumber\n\n    temp.Value = \"1\"\n\n    Add(temp)\nEnd Sub\n\nPublic Function CanSubtract(ByVal Other As CBigNumber) As Boolean\n    CanSubtract = (CompareAbs(mDigits, Other.mDigits) \u003e= 0)\nEnd Function\n\nPublic Sub Subtract(ByVal Other As CBigNumber)\n    Dim b As String\n\n    b = Other.Value\n\n    If CompareAbs(mDigits, b) \u003c 0 Then\n        mDigits = \"0\"\n    Else\n        mDigits = SubAbs(mDigits, b)\n    End If\nEnd Sub\n\nPublic Sub Multiply(ByVal Other as CBigNumber)\n    Dim b as String\n    b = Other.Value\n    \n    If b = \"0\" Or mDigits = \"0\" Then\n        mDigits = \"0\"\n        Exit Sub\n    End If\n    \n    mDigits = MultiplyAbs(mDigits, b)\nEnd Sub\n\nPrivate Function Normalize(ByVal s As String) As String\n    Dim i As Long\n    Dim ch As String\n\n    s = Trim$(s)\n\n    If Len(s) = 0 Then\n        Err.Raise vbObjectError + 1000, \"CBigNumber\", _\n                  \"Empty number\"\n    End If\n\n    For i = 1 To Len(s)\n        ch = Mid$(s, i, 1)\n\n        If ch \u003c \"0\" Or ch \u003e \"9\" Then\n            Err.Raise vbObjectError + 1001, \"CBigNumber\", _\n                      \"Invalid unsigned integer\"\n        End If\n    Next i\n\n    Do While Len(s) \u003e 1 And Left$(s, 1) = \"0\"\n        s = Mid$(s, 2)\n    Loop\n\n    Normalize = s\nEnd Function\n\n' Compare non-negative integer strings.\n' Returns 1 if a \u003e b, -1 if a \u003c b, otherwise 0.\nPrivate Function CompareAbs(ByVal a As String, _\n                            ByVal b As String) As Integer\n\n    If Len(a) \u003e Len(b) Then\n        CompareAbs = 1\n    ElseIf Len(a) \u003c Len(b) Then\n        CompareAbs = -1\n    ElseIf a \u003e b Then\n        CompareAbs = 1\n    ElseIf a \u003c b Then\n        CompareAbs = -1\n    Else\n        CompareAbs = 0\n    End If\nEnd Function\n\n' Add two non-negative integer strings.\nPrivate Function AddAbs(ByVal a As String, _\n                        ByVal b As String) As String\n\n    Dim i As Long\n    Dim j As Long\n    Dim da As Long\n    Dim db As Long\n    Dim carry As Long\n    Dim digit As Long\n    Dim result As String\n\n    i = Len(a)\n    j = Len(b)\n\n    Do While i \u003e 0 Or j \u003e 0 Or carry \u003e 0\n        da = 0\n        db = 0\n\n        If i \u003e 0 Then\n            da = Asc(Mid$(a, i, 1)) - 48\n            i = i - 1\n        End If\n\n        If j \u003e 0 Then\n            db = Asc(Mid$(b, j, 1)) - 48\n            j = j - 1\n        End If\n\n        digit = da + db + carry\n        carry = digit \\ 10\n        digit = digit Mod 10\n\n        result = Chr$(digit + 48) \u0026 result\n    Loop\n\n    AddAbs = result\nEnd Function\n\n\nPublic Sub AddPercent(ByVal Other As CBigNumber, ByVal f As Double)\n    Dim contribution As Double\n    Dim wholePart As Double\n    Dim fracPart As Double\n    Dim wholeString As String\n\n     ' Double cannot represent arbitrarily large integers exactly.\n    ' This approach is suitable when Other fits within Double precision.\n    contribution = CDbl(Other.mDigits) * f + Other.mFraction * f\n\n    wholePart = Fix(contribution)\n    fracPart = contribution - wholePart\n\n    wholeString = Format$(wholePart, \"0\")\n\n    mDigits = AddAbs(mDigits, wholeString)\n    mFraction = mFraction + fracPart\n\n    If mFraction \u003e= 1# Then\n        mDigits = AddAbs(mDigits, \"1\")\n        mFraction = mFraction - 1#\n    End If\nEnd Sub\n\n' Subtract b from a. Requires a \u003e= b.\nPrivate Function SubAbs(ByVal a As String, _\n                        ByVal b As String) As String\n\n    Dim i As Long\n    Dim j As Long\n    Dim da As Long\n    Dim db As Long\n    Dim borrow As Long\n    Dim digit As Long\n    Dim result As String\n\n    i = Len(a)\n    j = Len(b)\n\n    Do While i \u003e 0\n        da = Asc(Mid$(a, i, 1)) - 48 - borrow\n        db = 0\n\n        If j \u003e 0 Then\n            db = Asc(Mid$(b, j, 1)) - 48\n            j = j - 1\n        End If\n\n        If da \u003c db Then\n            da = da + 10\n            borrow = 1\n        Else\n            borrow = 0\n        End If\n\n        digit = da - db\n        result = Chr$(digit + 48) \u0026 result\n\n        i = i - 1\n    Loop\n\n    Do While Len(result) \u003e 1 And Left$(result, 1) = \"0\"\n        result = Mid$(result, 2)\n    Loop\n\n    SubAbs = result\nEnd Function\n\n\nPrivate Function MultiplyAbs(ByVal a As String, _\n                             ByVal b As String) As String\n    Dim result As String\n    Dim i As Long\n    Dim j As Long\n    Dim digit As Long\n    Dim carry As Long\n    Dim temp As String\n    Dim pos As Long\n    Dim arr() As Long\n\n    ReDim arr(Len(a) + Len(b))\n\n    For i = Len(a) To 1 Step -1\n        For j = Len(b) To 1 Step -1\n            digit = (Asc(Mid$(a, i, 1)) - 48) * _\n                    (Asc(Mid$(b, j, 1)) - 48)\n\n            pos = (Len(a) - i) + (Len(b) - j) + 1\n\n            arr(pos) = arr(pos) + digit\n        Next j\n    Next i\n\n    For i = 1 To UBound(arr) - 1\n        arr(i + 1) = arr(i + 1) + arr(i) \\ 10\n        arr(i) = arr(i) Mod 10\n    Next i\n\n    For i = UBound(arr) To 1 Step -1\n        result = result \u0026 Chr$(arr(i) + 48)\n    Next i\n\n    MultiplyAbs = Normalize(result)\nEnd Function\n\n\nPrivate Function DivideAbs(ByVal a As String, _\n                           ByVal b As String) As String\n    Dim result As String\n    Dim remainder As String\n    Dim i As Long\n    Dim digit As Long\n\n    If b = \"0\" Then\n        Err.Raise vbObjectError + 1020, \"CBigNumber\", _\n                  \"Division by zero\"\n    End If\n\n    remainder = \"0\"\n\n    For i = 1 To Len(a)\n        remainder = Normalize(remainder \u0026 Mid$(a, i, 1))\n\n        digit = 0\n\n        Do While CompareAbs(remainder, b) \u003e= 0\n            remainder = SubAbs(remainder, b)\n            digit = digit + 1\n        Loop\n\n        result = result \u0026 Chr$(digit + 48)\n    Next i\n\n    DivideAbs = Normalize(result)\nEnd Function\n\n\n\nPublic Function PercentOf(ByVal Other As CBigNumber) As String\n    Const PRECISION As Long = 4\n\n    Dim numerator As String\n    Dim denominator As String\n    Dim quotient As String\n    Dim result As String\n\n    If Other.Value = \"0\" Then\n        Err.Raise vbObjectError + 1020, \"CBigNumber\", _\n                  \"Division by zero\"\n    End If\n\n    ' A * 100 * 10000\n    numerator = MultiplyAbs(mDigits, \"1000000\")\n\n    ' Divide by B.\n    denominator = Other.mDigits\n\n    quotient = DivideAbs(numerator, denominator)\n\n    ' Format the result with four decimal places.\n    If Len(quotient) \u003c= PRECISION Then\n        quotient = String$(PRECISION + 1 - Len(quotient), \"0\") \u0026 quotient\n    End If\n\n    result = Left$(quotient, Len(quotient) - PRECISION) \u0026 \".\" \u0026 _\n             Right$(quotient, PRECISION)\n\n    PercentOf = result\nEnd Function\n\n\n\nPublic Function Display() As String\n    Dim names As Variant\n    Dim groupIndex As Long\n    Dim leadingDigits As Long\n    Dim leading As String\n    Dim fractional As String\n    Dim remainder As String\n\n    names = Array( _\n        \"\", \"thousand\", \"million\", \"billion\", _\n        \"trillion\", \"quadrillion\", \"quintillion\", _\n        \"sextillion\", \"septillion\", \"octillion\", _\n        \"nonillion\", \"decillion\", \"undecillion\", _\n        \"duodecillion\", \"tredecillion\", _\n        \"quattuordecillion\", \"quindecillion\", _\n        \"sexdecillion\", \"septendecillion\", _\n        \"octodecillion\", \"novemdecillion\", _\n        \"vigintillion\")\n\n    ' Below one million, show the full number.\n    If Len(mDigits) \u003c= 6 Then\n        Display = mDigits\n        Exit Function\n    End If\n\n    groupIndex = (Len(mDigits) - 1) \\ 3\n    leadingDigits = Len(mDigits) - groupIndex * 3\n\n    leading = Left$(mDigits, leadingDigits)\n\n    ' Read the next two digits as the fractional part.\n    remainder = Mid$(mDigits, leadingDigits + 1, 2)\n\n    If Len(remainder) \u003e 0 Then\n        remainder = remainder \u0026 String$(2 - Len(remainder), \"0\")\n    End If\n\n    If remainder \u003c\u003e \"\" Then\n        fractional = \".\" \u0026 remainder\n    Else\n        fractional = \"\"\n    End If\n\n    If groupIndex \u003c= UBound(names) Then\n        Display = leading \u0026 fractional \u0026 \" \" \u0026 names(groupIndex)\n    Else\n        Display = leading \u0026 fractional \u0026 \" x 10^\" \u0026 _\n                  CStr(groupIndex * 3)\n    End If\nEnd Function\n\n\n","bookmarks":[]}],"settings":{"anchoring":false,"snapToGrid":true,"gridSize":120,"showGrid":true,"renderer":"auto","tabWidth":4,"requireVariableDeclaration":true},"references":[],"assets":{},"vfs":{"version":3,"files":{},"directories":["/","/Windows","/Temp"],"metadata":{"/":{"attributes":16,"modified":1793131578883},"/Windows":{"attributes":16,"modified":1793131781478},"/Temp":{"attributes":16,"modified":1793131781478}}},"appSettings":{},"storageFormat":"web"}</script><script id="vb6-options" type="application/json">{"persist":true}</script><script defer src="./runtime.js"></script>
