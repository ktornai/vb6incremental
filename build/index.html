<!doctype html>
<html lang="en" data-vb-theme="classic"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="generator" content="VB6 Studio Web 0.6.0"><meta name="color-scheme" content="light"><title>Data Processor 2000</title><meta name="description" content="Incremental game about calculating veryyy big data byte by byte"><link rel="stylesheet" href="./app.css"></head><body><div id="app"></div><p id="vb6-startup" role="status" aria-live="polite">Starting application…</p><noscript>This application requires JavaScript.</noscript><script id="vb6-project" type="application/json">{"schema":1,"id":"id_mvr47wcg_2j","name":"Data Processor 2000","description":"Incremental game about calculating veryyy big data byte by byte","startup":"Form1","modules":[{"id":"id_mvr47wcg_2h","name":"Form1","kind":"form","code":"Option Explicit\n\nDim gScore as CBigNumber\nDim gBPS as CBigNumber\nDim gTickBPS as CBigNumber\n\nPrivate Sub UpdateScoreAndBPSLabel()\n    lblScore.Caption = gScore.Display()\n    lblBPS.Caption = \"processing rate: \" + gBPS.Display()\n    \nEnd Sub\n\n\nPrivate Sub Form_Load()\n    \n    Set gScore = new CBigNumber\n    Set gBPS = new CBigNumber\n    Set gTickBPS = new CBigNumber\n        \n    gScore.Value = \"0\"\n    gBPS.Value = \"1\"\n    gTickBPS.Value = \"0\"\n        \n    UpdateScoreAndBPSLabel()\nEnd Sub\n\nPrivate Sub CommandButton1_Click()\n    gTickBPS.Add(gBPS)\nEnd Sub\n\nPrivate Sub Timer1_Timer()\n    If Not gBPS.IsZero Then\n        gTickBPS.AddPercent(gBPS, 0.25)\n    End If\n    \n    gScore.Add(gTickBPS)\n    gTickBPS.Value = \"0\"\n    \n    UpdateScoreAndBPSLabel()\nEnd Sub\n","form":{"id":"id_mvr47wcg_2i","name":"Form1","type":"Form","properties":{"Name":"Form1","Caption":"Data Processor 2000","ClientWidth":10920,"ClientHeight":5760,"Width":9120,"Height":6450,"Left":2293,"Top":3102,"StartUpPosition":2,"BorderStyle":1,"BackColor":-2147483633,"ForeColor":-2147483640,"FontName":"MS Sans Serif","FontSize":8.25,"FontBold":0,"FontItalic":0,"ScaleMode":3,"KeyPreview":0,"Visible":-1,"Enabled":-1},"controls":[{"id":"id_mvr49jrv_2n","name":"CommandButton1","type":"CommandButton","parent":null,"properties":{"Name":"CommandButton1","Left":1440,"Top":1920,"Width":3120,"Height":2400,"Visible":-1,"Enabled":-1,"TabIndex":0,"TabStop":-1,"FontName":"MS Sans Serif","FontSize":8.25,"FontBold":0,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483633,"ToolTipText":"","Tag":"","Caption":"Process data","Default":0,"Cancel":0}},{"id":"id_mvr4atxn_2o","name":"Label1","type":"Label","parent":null,"properties":{"Name":"Label1","Left":2400,"Top":360,"Width":1320,"Height":240,"Visible":-1,"Enabled":-1,"TabIndex":1,"TabStop":0,"FontName":"MS Sans Serif","FontSize":8.25,"FontBold":0,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483633,"ToolTipText":"","Tag":"","Caption":"Data processed:","BackStyle":0,"Alignment":2}},{"id":"id_mvr4bj41_2p","name":"lblScore","type":"Label","parent":null,"properties":{"Name":"lblScore","Left":0,"Top":720,"Width":6120,"Height":720,"Visible":-1,"Enabled":-1,"TabIndex":2,"TabStop":0,"FontName":"MS Sans Serif","FontSize":20,"FontBold":-1,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483633,"ToolTipText":"","Tag":"","Caption":"0","BackStyle":0,"Alignment":2,"FontUnderline":0,"FontStrikethru":0}},{"id":"id_mvr4mhys_2u","name":"lblBPS","type":"Label","parent":null,"properties":{"Name":"lblBPS","Left":0,"Top":1320,"Width":6120,"Height":480,"Visible":-1,"Enabled":-1,"TabIndex":3,"TabStop":0,"FontName":"MS Sans Serif","FontSize":10,"FontBold":-1,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483633,"ToolTipText":"","Tag":"","Caption":"processing rate: 0","BackStyle":0,"Alignment":2,"FontUnderline":0,"FontStrikethru":0}},{"id":"id_mvtzju7f_2b","name":"ProgressBar1","type":"ProgressBar","parent":null,"properties":{"Name":"ProgressBar1","Left":1440,"Top":4920,"Width":3120,"Height":360,"Visible":-1,"Enabled":-1,"TabIndex":4,"TabStop":0,"FontName":"MS Sans Serif","FontSize":8.25,"FontBold":0,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483633,"ToolTipText":"","Tag":"","Min":0,"Max":1000,"Value":500}},{"id":"id_mvtzkkmm_2c","name":"Label2","type":"Label","parent":null,"properties":{"Name":"Label2","Left":1440,"Top":4680,"Width":3240,"Height":240,"Visible":-1,"Enabled":-1,"TabIndex":5,"TabStop":0,"FontName":"MS Sans Serif","FontSize":8.25,"FontBold":0,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483633,"ToolTipText":"","Tag":"","Caption":"Current data chunk:","BackStyle":0,"Alignment":0}},{"id":"id_mvu0sn7n_2g","name":"Timer1","type":"Timer","parent":null,"properties":{"Name":"Timer1","Left":4800,"Top":2880,"Width":420,"Height":420,"Visible":-1,"Enabled":-1,"TabIndex":0,"TabStop":0,"FontName":"MS Sans Serif","FontSize":8.25,"FontBold":0,"FontItalic":0,"ForeColor":-2147483640,"BackColor":-2147483633,"ToolTipText":"","Tag":"","Interval":250}}],"menus":[]},"bookmarks":[]},{"id":"id_mvtynqyn_1j","name":"CBigNumber","kind":"class","code":"Option Explicit\n\nPrivate mDigits As String\nPrivate mFraction As Double\n\nPrivate Sub Class_Initialize()\n    mDigits = \"0\"\n    mFraction = 0#\nEnd Sub\n\nPublic Property Get Value() As String\n    Value = mDigits\nEnd Property\n\nPublic Property Let Value(ByVal s As String)\n    mDigits = Normalize(s)\nEnd Property\n\nPublic Function IsZero() as Boolean\n    IsZero = mDigits = \"0\" And mFraction = 0#\nEnd Function\n\nPublic Sub Add(ByVal Other As CBigNumber)\n    mDigits = AddAbs(mDigits, Other.Value)\nEnd Sub\n\nPublic Sub Subtract(ByVal Other As CBigNumber)\n    Dim b As String\n\n    b = Other.Value\n\n    If CompareAbs(mDigits, b) \u003c 0 Then\n        mDigits = \"0\"\n    Else\n        mDigits = SubAbs(mDigits, b)\n    End If\nEnd Sub\n\n\nPrivate Function Normalize(ByVal s As String) As String\n    Dim i As Long\n    Dim ch As String\n\n    s = Trim$(s)\n\n    If Len(s) = 0 Then\n        Err.Raise vbObjectError + 1000, \"CBigNumber\", _\n                  \"Empty number\"\n    End If\n\n    For i = 1 To Len(s)\n        ch = Mid$(s, i, 1)\n\n        If ch \u003c \"0\" Or ch \u003e \"9\" Then\n            Err.Raise vbObjectError + 1001, \"CBigNumber\", _\n                      \"Invalid unsigned integer\"\n        End If\n    Next i\n\n    Do While Len(s) \u003e 1 And Left$(s, 1) = \"0\"\n        s = Mid$(s, 2)\n    Loop\n\n    Normalize = s\nEnd Function\n\n' Compare non-negative integer strings.\n' Returns 1 if a \u003e b, -1 if a \u003c b, otherwise 0.\nPrivate Function CompareAbs(ByVal a As String, _\n                            ByVal b As String) As Integer\n\n    If Len(a) \u003e Len(b) Then\n        CompareAbs = 1\n    ElseIf Len(a) \u003c Len(b) Then\n        CompareAbs = -1\n    ElseIf a \u003e b Then\n        CompareAbs = 1\n    ElseIf a \u003c b Then\n        CompareAbs = -1\n    Else\n        CompareAbs = 0\n    End If\nEnd Function\n\n' Add two non-negative integer strings.\nPrivate Function AddAbs(ByVal a As String, _\n                        ByVal b As String) As String\n\n    Dim i As Long\n    Dim j As Long\n    Dim da As Long\n    Dim db As Long\n    Dim carry As Long\n    Dim digit As Long\n    Dim result As String\n\n    i = Len(a)\n    j = Len(b)\n\n    Do While i \u003e 0 Or j \u003e 0 Or carry \u003e 0\n        da = 0\n        db = 0\n\n        If i \u003e 0 Then\n            da = Asc(Mid$(a, i, 1)) - 48\n            i = i - 1\n        End If\n\n        If j \u003e 0 Then\n            db = Asc(Mid$(b, j, 1)) - 48\n            j = j - 1\n        End If\n\n        digit = da + db + carry\n        carry = digit \\ 10\n        digit = digit Mod 10\n\n        result = Chr$(digit + 48) \u0026 result\n    Loop\n\n    AddAbs = result\nEnd Function\n\n\nPublic Sub AddPercent(ByVal Other As CBigNumber, ByVal f As Double)\n    Dim contribution As Double\n    Dim wholePart As Double\n    Dim fracPart As Double\n    Dim wholeString As String\n\n    If f \u003c 0# Or f \u003e 1# Then\n        Err.Raise vbObjectError + 1003, \"CBigNumber\", _\n                  \"Factor must be between 0 and 1\"\n    End If\n\n    ' Double cannot represent arbitrarily large integers exactly.\n    ' This approach is suitable when Other fits within Double precision.\n    contribution = CDbl(Other.mDigits) * f + Other.mFraction * f\n\n    wholePart = Fix(contribution)\n    fracPart = contribution - wholePart\n\n    wholeString = Format$(wholePart, \"0\")\n\n    mDigits = AddAbs(mDigits, wholeString)\n    mFraction = mFraction + fracPart\n\n    If mFraction \u003e= 1# Then\n        mDigits = AddAbs(mDigits, \"1\")\n        mFraction = mFraction - 1#\n    End If\nEnd Sub\n\n' Subtract b from a. Requires a \u003e= b.\nPrivate Function SubAbs(ByVal a As String, _\n                        ByVal b As String) As String\n\n    Dim i As Long\n    Dim j As Long\n    Dim da As Long\n    Dim db As Long\n    Dim borrow As Long\n    Dim digit As Long\n    Dim result As String\n\n    i = Len(a)\n    j = Len(b)\n\n    Do While i \u003e 0\n        da = Asc(Mid$(a, i, 1)) - 48 - borrow\n        db = 0\n\n        If j \u003e 0 Then\n            db = Asc(Mid$(b, j, 1)) - 48\n            j = j - 1\n        End If\n\n        If da \u003c db Then\n            da = da + 10\n            borrow = 1\n        Else\n            borrow = 0\n        End If\n\n        digit = da - db\n        result = Chr$(digit + 48) \u0026 result\n\n        i = i - 1\n    Loop\n\n    Do While Len(result) \u003e 1 And Left$(result, 1) = \"0\"\n        result = Mid$(result, 2)\n    Loop\n\n    SubAbs = result\nEnd Function\n\n\nPublic Function Display() As String\n    Dim names As Variant\n    Dim groupIndex As Long\n    Dim leadingDigits As Long\n    Dim leading As String\n    Dim fractional As String\n    Dim remainder As String\n\n    names = Array( _\n        \"\", \"thousand\", \"million\", \"billion\", _\n        \"trillion\", \"quadrillion\", \"quintillion\", _\n        \"sextillion\", \"septillion\", \"octillion\", _\n        \"nonillion\", \"decillion\", \"undecillion\", _\n        \"duodecillion\", \"tredecillion\", _\n        \"quattuordecillion\", \"quindecillion\", _\n        \"sexdecillion\", \"septendecillion\", _\n        \"octodecillion\", \"novemdecillion\", _\n        \"vigintillion\")\n\n    ' Below one million, show the full number.\n    If Len(mDigits) \u003c= 6 Then\n        Display = mDigits\n        Exit Function\n    End If\n\n    groupIndex = (Len(mDigits) - 1) \\ 3\n    leadingDigits = Len(mDigits) - groupIndex * 3\n\n    leading = Left$(mDigits, leadingDigits)\n\n    ' Read the next two digits as the fractional part.\n    remainder = Mid$(mDigits, leadingDigits + 1, 2)\n\n    If Len(remainder) \u003e 0 Then\n        remainder = remainder \u0026 String$(2 - Len(remainder), \"0\")\n    End If\n\n    If remainder \u003c\u003e \"\" Then\n        fractional = \".\" \u0026 remainder\n    Else\n        fractional = \"\"\n    End If\n\n    If groupIndex \u003c= UBound(names) Then\n        Display = leading \u0026 fractional \u0026 \" \" \u0026 names(groupIndex)\n    Else\n        Display = leading \u0026 fractional \u0026 \" x 10^\" \u0026 _\n                  CStr(groupIndex * 3)\n    End If\nEnd Function\n\n\n","bookmarks":[]}],"settings":{"anchoring":false,"snapToGrid":true,"gridSize":120,"showGrid":true,"renderer":"auto","tabWidth":4,"requireVariableDeclaration":true},"references":[],"assets":{},"vfs":{"version":3,"files":{},"directories":["/","/Windows","/Temp"],"metadata":{"/":{"attributes":16,"modified":1793131578883},"/Windows":{"attributes":16,"modified":1793131781478},"/Temp":{"attributes":16,"modified":1793131781478}}},"appSettings":{},"storageFormat":"web"}</script><script id="vb6-options" type="application/json">{"persist":true}</script><script defer src="./runtime.js"></script>
